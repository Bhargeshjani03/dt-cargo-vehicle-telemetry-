name: Anomaly model continuous training

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anomaly-model-continuous-training
  cancel-in-progress: false

jobs:
  train-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KUBERNS_BUCKET_ID: ${{ secrets.KUBERNS_BUCKET_ID }}
      KUBERNS_ACCESS_KEY_ID: ${{ secrets.KUBERNS_ACCESS_KEY_ID }}
      KUBERNS_SECRET: ${{ secrets.KUBERNS_SECRET }}
      KUBERNS_TRAINING_KEY: ${{ vars.KUBERNS_TRAINING_KEY }}
      KUBERNS_CANDIDATE_PREFIX: ${{ vars.KUBERNS_CANDIDATE_PREFIX }}
      DT_CARGO_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DT_CARGO_REVIEW_RATE: "0.02"
      DT_CARGO_VALIDATION_FRACTION: "0.20"
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install training dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrain and publish a review candidate
        run: python -m src.mlops.train_anomaly_candidate
